<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0aa563"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Salon Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#edf0f8;--cd:#fff;--tx:#0f1630;--mu:#5f6987;--bd:#e0e5f1;--ac:#0aa563;--g:#0aa563;--b:#1b8cff;--or:#ee8a10;--rd:#e0342a;--pk:#c2386f}
:root[data-theme="dark"]{--bg:#0b1020;--cd:#161c30;--tx:#eef1ff;--mu:#9aa4c8;--bd:#262d48}
*{box-sizing:border-box}
body{margin:0 auto;max-width:560px;padding:14px 14px 92px;background:var(--bg);color:var(--tx);font:13px/1.4 system-ui,"Segoe UI",Roboto,sans-serif}
.f,h1,h2,h3,.nav a,.b,.chip,.tag{font-family:Oswald,"Roboto Condensed",sans-serif-condensed,"Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.04em}
h1{font-size:30px;line-height:1.05;margin:0;font-weight:700}h2{font-size:14px;margin:16px 0 6px;color:var(--mu);font-weight:600}h3{font-size:14px;margin:0;font-weight:600}
small,.mu{color:var(--mu);font-size:11.5px}.sm{font-family:Oswald,"Roboto Condensed",sans-serif-condensed,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);font-size:13px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}.top .bt{display:flex;gap:7px}
.ib{width:38px;height:38px;border-radius:12px;border:0;background:var(--cd);color:var(--tx);display:inline-grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px #1a284a14}.ib.on{background:var(--ac);color:#fff}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:12px;margin-top:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.hero{display:flex;gap:10px;align-items:center;border-radius:20px;padding:12px;color:#fff;box-shadow:0 6px 16px #0a63d622}
.hero .ico{width:38px;height:38px;border-radius:12px;background:#ffffff30;display:grid;place-items:center;flex:none}.hero .lb{font-size:12.5px;opacity:.95}.hero .vl{font-size:24px;font-weight:700;line-height:1.1}.hero .sb{font-size:10.5px;opacity:.9}
.hg{background:linear-gradient(135deg,#0aa563,#07804e)}.hb{background:linear-gradient(135deg,#1b8cff,#0a63d6)}
.tile{background:var(--cd);border:1px solid var(--bd);border-top:4px solid var(--c);border-radius:20px;padding:10px 12px}.tile .ico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);margin-bottom:6px}.tile .lb{font-size:12.5px;color:var(--mu)}.tile .vl{font-size:22px;font-weight:700}
.b{border:0;border-radius:12px;padding:9px 14px;font-size:14px;font-weight:600;background:linear-gradient(135deg,#0aa563,#07804e);color:#fff;cursor:pointer;display:inline-flex;gap:6px;align-items:center;justify-content:center;text-decoration:none}
.b.f2{width:100%;margin-top:10px}.b.gh{background:var(--cd);color:var(--tx);border:1px solid var(--bd)}.b.bl{background:linear-gradient(135deg,#1b8cff,#0a63d6)}.b.r{background:var(--rd)}.b.s{padding:6px 11px;font-size:12.5px}
.lk{background:none;border:0;color:var(--rd);cursor:pointer;padding:4px;display:inline-flex}
input,select{width:100%;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:13px system-ui;margin-top:7px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chips{display:flex;gap:7px;overflow-x:auto;margin:10px 0 4px;padding-bottom:2px}
.chip{flex:none;border:1px solid var(--bd);background:var(--cd);color:var(--mu);border-radius:18px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer}.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.tag{border-radius:8px;padding:2px 9px;font-size:11.5px;color:#fff}
.tok{font-size:18px;font-weight:700;color:var(--b)}
.svc{display:flex;gap:10px;align-items:center;padding:11px 12px;border:1.5px solid var(--bd);border-radius:16px;margin-top:8px;background:var(--cd);cursor:pointer}
.svc.on{border-color:var(--g);background:color-mix(in srgb,var(--g) 9%,var(--cd))}
.svc b{font-size:14px;font-weight:700}.svc small{display:block}.svc .p{margin-left:auto;font:700 17px Oswald,sans-serif-condensed,sans-serif;color:var(--g);white-space:nowrap}
.lks{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}.lks a{display:inline-flex;gap:5px;align-items:center;text-decoration:none;color:#fff;border-radius:16px;padding:5px 11px;font:600 12px Oswald,sans-serif-condensed,sans-serif;text-transform:uppercase;letter-spacing:.04em}
.bar{height:7px;border-radius:4px;background:var(--bd);margin-top:4px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#0aa563,#1b8cff)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--cd);border-top:1px solid var(--bd);display:flex;align-items:flex-end;padding:6px 2px calc(6px + env(safe-area-inset-bottom,0px))}
.nav a{flex:1;color:var(--mu);font-size:11.5px;font-weight:600;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}.nav a.on{color:var(--ac)}
.nav .ctr span{width:54px;height:54px;border-radius:50%;background:var(--cd);border:5px solid var(--bg);box-shadow:0 4px 14px #1a284a30;display:grid;place-items:center;color:var(--b);margin-top:-30px}
.sticky{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:540px;margin:auto;background:var(--tx);color:var(--bg);border-radius:16px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font:700 16px Oswald,sans-serif-condensed,sans-serif;text-transform:uppercase}
details{background:var(--cd);border:1px solid var(--bd);border-radius:18px;margin-top:10px}summary{padding:12px;font:600 14px Oswald,sans-serif-condensed,sans-serif;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;display:flex;gap:8px;align-items:center}details>div{padding:0 12px 12px}
.pst{display:block;margin:6px auto;max-width:290px;width:100%;height:auto;border-radius:18px;box-shadow:0 6px 20px #0003}
.ban{border-radius:22px;padding:16px;color:#fff;background:linear-gradient(135deg,#0aa563,#1b8cff)}.ban h1{font-size:28px}.ban small{color:#ffffffd0}
.tc{text-align:center}.tc .tok{font-size:38px}
#scan{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:9}#scan .sc{background:var(--cd);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:14px}#scan video{width:100%;border-radius:14px;background:#000;margin-top:10px;max-height:46vh;object-fit:cover}
.tile{position:relative}.go{position:absolute;top:11px;right:11px;color:var(--mu);display:inline-flex}.hero{position:relative}.hero .go{color:#fff;opacity:.85}
.hero:active,.tile:active,.li:active{transform:scale(.985)}
.list{background:var(--cd);border:1px solid var(--bd);border-radius:16px;overflow:hidden}.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--bd);cursor:pointer}.li:last-child{border:0}
.li .ti{width:36px;height:36px;border-radius:10px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);display:grid;place-items:center;flex:none}.li b{font-size:14px}.li small{display:block}.li .go{position:static;margin-left:auto}

 if(setp==='staff')return bk('Staff')+`<div class="card">${S.workers.length?S.workers.map((w,i)=>`<div class="row" style="margin-top:${i?10:0}px"><span class="f" style="font-size:15px">${esc(w.n)}</span><button class="lk" onclick="if(confirm('Remove this staff member?')){S.workers.splice(${i},1);save();render()}">${ic('trash')}</button></div>`).join(''):'<div class="mu">No staff added.</div>'}</div><h2>Add staff</h2><div class="card" style="margin-top:0"><input id="nw" placeholder="Staff name" style="margin-top:0"><button class="b f2" onclick="if($('#nw').value.trim()){S.workers.push({n:$('#nw').value.trim()});save();render()}">${ic('plus')} Add staff</button></div><small style="display:block;margin-top:8px">Each staff member gets a full report: customers, services and money collected (Home, Staff report).</small>`;
 if(setp==='qr'){const u=pageUrl(),g=S.gh||{};return bk('QR poster')+`<div class="card">${poster()}<div class="chips" style="justify-content:center">${[['s','Simple'],['d','With model']].map(x=>`<button class="chip ${(S.salon.ps||'s')===x[0]?'on':''}" onclick="S.salon.ps='${x[0]}';save();render()">${x[1]}</button>`).join('')}</div>${u?`<button class="b f2" onclick="dlPng()">${ic('down')} Save poster (PNG)</button><a class="b gh f2" target="_blank" href="${esc(u)}">Test link</a>`:''}</div>
<h2>Customer page link</h2><div class="card" style="margin-top:0"><input placeholder="https://username.github.io/Salons/" value="${esc(S.salon.url)}" onchange="setUrl(this.value)" style="margin-top:0"></div>
<h2>Publish menu to customers</h2><div class="card" style="margin-top:0"><b>Auto publish (one tap)</b><small style="display:block;margin:4px 0 8px">Needs internet. Fill once, then tap Publish after any change to services, prices or links.</small><input placeholder="GitHub username" value="${esc(g.u||'')}" onchange="gh('u',this.value)" style="margin-top:0"><input placeholder="Repository name (Salons)" value="${esc(g.r||'')}" onchange="gh('r',this.value)"><input type="password" placeholder="GitHub token (github_pat_...)" value="${esc(g.t||'')}" onchange="gh('t',this.value)"><button class="b f2" onclick="ghPublish()">${ic('up')} Publish now</button><small style="display:block;margin-top:10px">Token: GitHub, profile photo, Settings, Developer settings, Personal access tokens, Fine-grained tokens, Generate new token. Repository access: only select repositories, choose your repository. Permissions, Contents: Read and write. Generate and copy it here.</small><div style="border-top:1px solid var(--bd);margin:14px 0 10px"></div><b>Manual option</b><small style="display:block;margin:4px 0">Copy the page code and paste it into index.html on GitHub.</small><button class="b gh f2" onclick="pageSheet()">Copy page code</button></div>`}
 if(setp==='sec')return bk('Owner PIN')+`<div class="card"><small>PIN protects the owner app. Customers never need it.</small><input type="password" inputmode="numeric" placeholder="Set PIN (blank = off)" value="${esc(S.pin)}" onchange="S.pin=this.value;save()"></div>`;
 return bk('Backup and restore')+`<div class="card"><div class="g2" style="margin-top:0"><button class="b" onclick="bkp()">${ic('down')} Backup</button><label class="b gh" style="cursor:pointer">${ic('up')} Restore<input type="file" accept=".json" hidden onchange="rst(this.files[0])"></label></div><button class="b gh f2" onclick="rcode()">Restore from copied code</button><small style="display:block;margin-top:10px">Backup moves your data to another phone. It does not include your GitHub token.</small></div><h2>Danger zone</h2><button class="b f2 r" onclick="if(confirm('Delete all data?')){S=JSON.parse(JSON.stringify(D));save();render()}">Reset all data</button>`}
function sets(){const h=sets0();return ['prof','links','svc','staff'].includes(setp)?h+`<div class="card" style="border-color:var(--g)"><small>Changes show on the customer page only after you publish.</small><button class="b f2" onclick="pubGo()">${ic('up')} Publish to customers</button></div>`:h}
function bkp(){const t=JSON.stringify({...S,gh:undefined});sheet({t:'Backup',name:'salon-backup.json',mime:'application/json',text:t,blob:new Blob([t],{type:'application/json'}),hint:'Copy this code and keep it safe, for example send it to yourself on WhatsApp.'})}
function rcode(){const t=prompt('Paste backup code');if(t)try{S=Object.assign(JSON.parse(t),{gh:S.gh});save();render()}catch(e){alert('Invalid code')}}
function rst(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{S=Object.assign(JSON.parse(r.result),{gh:S.gh});save();render()}catch(e){alert('Invalid backup file')}};r.readAsText(f)}
function addS(){const n=$('#sn').value,p=+$('#sp').value;if(!n||!p)return;S.services.push({id:Date.now(),cat:$('#sc').value||'Other',name:n,price:p,desc:$('#sd').value});save();render()}
/* scan and import */
async function scanOpen(){scanClose();const o=document.createElement('div');o.id='scan';o.innerHTML=`<div class="sc"><div class="row"><h3>Scan customer token</h3><button class="ib" onclick="scanClose()">${ic('x')}</button></div><video id="vd" playsinline muted></video><small id="sm" style="display:block;margin-top:6px">Point the camera at the token QR on the customer phone.</small><input id="cd" placeholder="Or paste the booking code from WhatsApp"><button class="b f2" onclick="addCode($('#cd').value)">Add booking</button></div>`;document.body.appendChild(o);
 try{if(!('BarcodeDetector' in window))throw 0;const det=new BarcodeDetector({formats:['qr_code']});stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=$('#vd');v.srcObject=stream;await v.play();tm=setInterval(async()=>{try{const r=await det.detect(v);if(r.length)addCode(r[0].rawValue)}catch(e){}},350)}catch(e){const v=$('#vd');if(v)v.remove();const m=$('#sm');if(m)m.textContent='Camera scan is not available here. Paste the booking code below.'}}
function scanClose(){clearInterval(tm);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;const o=$('#scan');if(o)o.remove()}
function addCode(c){const m=String(c).match(/GLAM\|[^\n]*/);if(!m){alert('Invalid booking code');return}const p=m[0].trim().split('|');if(p.length<7){alert('Invalid booking code');return}
 clearInterval(tm);const[,tok,name,phone,items,pref]=p;if(S.visits.some(v=>v.token===tok&&v.phone===phone)){scanClose();alert('Token '+tok+' is already added.');return}
 const it=items.split('.').filter(Boolean).map(x=>{const[i,pr]=x.split(':'),s=S.services.find(z=>z.id==i);return{name:s?s.name:'Service',price:+pr||0}});
 S.visits.push({id:Date.now(),token:tok,name,phone,items:it,total:sum(it.map(i=>i.price)),disc:0,paid:0,pay:'',pref,status:'pending',date:Date.now()});save();scanClose();tab='home';det=null;render();alert('Added '+tok+' - '+name)}
/* customer */
const tot=()=>sum(S.services.filter(s=>sel.includes(s.id)).map(s=>s.price));
function tog(id){sel=sel.includes(id)?sel.filter(x=>x!==id):[...sel,id];document.querySelectorAll('.svc').forEach(e=>e.classList.toggle('on',sel.includes(+e.dataset.id)));$('#tt').textContent=rs(tot())+' · '+sel.length}
function book(){const ph=cp.trim();if(!sel.length)return alert('Select at least one service.');if(!cn.trim()||ph.length<7)return alert('Enter your name and phone number.');
 const it=S.services.filter(s=>sel.includes(s.id));tkt={token:'T-'+Date.now().toString(36).slice(-4).toUpperCase(),name:cn.trim().replace(/\|/g,' '),phone:ph.replace(/\|/g,''),items:it,total:tot(),pref:cw};
 tkt.code=['GLAM',tkt.token,tkt.name,tkt.phone,it.map(s=>s.id+':'+s.price).join('.'),tkt.pref,Date.now().toString(36)].join('|');render()}
function svcList(){const q=cq.toLowerCase();return S.services.filter(s=>(cc==='All'||s.cat===cc)&&(!q||(s.name+s.desc).toLowerCase().includes(q))).map(s=>`<div class="svc ${sel.includes(s.id)?'on':''}" data-id="${s.id}" onclick="tog(${s.id})"><div><b>${esc(s.name)}</b><small>${esc(s.desc)}</small></div><div class="p">${rs(s.price)}</div></div>`).join('')||'<div class="mu" style="margin-top:8px">No service found.</div>'}
function custView(){const back=pure?'':`<button class="ib" onclick="cust=false;tkt=null;sel=[];render()" aria-label="Back">${ic('x')}</button>`;
 if(tkt)return `<div class="top"><div></div><div class="bt">${tb()}${back}</div></div><div class="card tc"><div class="sm">Thank you, ${esc(tkt.name)}</div><div class="f tok">${tkt.token}</div><div style="display:flex;justify-content:center;margin:10px 0">${qsvg(tkt.code,200)}</div><div class="mu">${tkt.items.map(i=>esc(i.name)).join(', ')}</div><b class="f" style="font-size:24px">${rs(tkt.total)}</b><p class="mu">Show this token QR at the counter.</p><a class="b f2" target="_blank" href="${wa(S.salon.phone,`${S.salon.name}\nToken ${tkt.token}: ${tkt.items.map(i=>i.name).join(', ')}\nTotal ${rs(tkt.total)}\n\n${tkt.code}`)}">${ic('wa')} Send booking on WhatsApp</a><button class="b gh f2" onclick="tkt=null;sel=[];cn=cp=cw='';render()">New booking</button></div>`;
 const cats=['All',...new Set(S.services.map(s=>s.cat))];
 return `<div class="top"><div></div><div class="bt">${tb()}${back}</div></div><div class="ban"><small class="f">Welcome to</small><h1>${esc(S.salon.name)}</h1><div class="lks">${Object.keys(LK).filter(k=>S.salon.links[k]).map(k=>`<a style="background:#ffffff26" href="${esc(S.salon.links[k])}" target="_blank" rel="noopener">${ic(LK[k][2],14)}${LK[k][0]}</a>`).join('')}</div></div>
 <input placeholder="Search services" value="${esc(cq)}" oninput="cq=this.value;$('#sl').innerHTML=svcList()"><div class="chips">${cats.map(c=>`<button class="chip ${cc===c?'on':''}" data-c="${esc(c)}" onclick="cc=this.dataset.c;render()">${esc(c)}</button>`).join('')}</div><div id="sl">${svcList()}</div>
 <h2>Your details</h2><div class="card" style="margin-top:0"><input placeholder="Your name" value="${esc(cn)}" oninput="cn=this.value" style="margin-top:0"><input type="tel" inputmode="tel" placeholder="Phone number" value="${esc(cp)}" oninput="cp=this.value"><select onchange="cw=this.value"><option value="">Any stylist</option>${S.workers.map(w=>`<option ${cw===w.n?'selected':''}>${esc(w.n)}</option>`).join('')}</select></div><div style="height:64px"></div>
 <div class="sticky"><span id="tt">${rs(tot())} · ${sel.length}</span><button class="b" onclick="book()">Get token</button></div>`}
addEventListener('hashchange',()=>location.reload());
render();
</script>
